<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memory Master</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg, #0f172a, #312e81);
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 20px;
}

/* PLAYER */

.player {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 15px;
}

.player input {
    width: 250px;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

/* BUTTONS */

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    font-weight: bold;
}

.new-game {
    background: #22c55e;
    color: white;
}

.levels {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.level {
    background: #334155;
    color: white;
}

.level.active {
    background: #3b82f6;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}

.stat small {
    color: #cbd5e1;
}

.stat strong {
    display: block;
    font-size: 21px;
    margin-top: 4px;
}

/* BOARD */

.board {
    width: min(90vw, 700px);
    aspect-ratio: 1 / 1;
    margin: auto;

    display: grid;
    gap: 7px;
}

/* CARD */

.card {
    perspective: 800px;
    cursor: pointer;
}

.card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.card-front,
.card-back {
    position: absolute;
    width: 100%;
    height: 100%;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.card-front {
    background: #475569;
    border: 2px solid #64748b;
    font-size: 25px;
}

.card-back {
    background: white;
    color: #111827;
    transform: rotateY(180deg);
    font-size: clamp(20px, 5vw, 40px);
}

.card.matched .card-back {
    background: #bbf7d0;
    border: 3px solid #22c55e;
}

/* CONTROLS */

.controls {
    text-align: center;
    margin: 15px;
}

.controls button {
    margin: 5px;
}

.restart {
    background: #6366f1;
    color: white;
}

.sound {
    background: #475569;
    color: white;
}

/* MESSAGE */

.message {
    text-align: center;
    min-height: 25px;
    color: #86efac;
    font-weight: bold;
}

/* LEADERBOARD */

.leaderboard {
    margin-top: 25px;
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 12px;
}

.leaderboard h2 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 9px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    text-align: center;
}

th {
    color: #93c5fd;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.7);

    display: none;
    align-items: center;
    justify-content: center;

    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: #1e293b;
    width: min(90%, 400px);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

.trophy {
    font-size: 60px;
}

.modal-box button {
    margin-top: 15px;
    background: #22c55e;
    color: white;
}

/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 28px;
    }

    .player {
        flex-direction: column;
    }

    .player input {
        width: 100%;
    }

    .stats {
        grid-template-columns: repeat(2,1fr);
    }

    .board {
        width: 96vw;
        gap: 4px;
    }

    .card-front,
    .card-back {
        border-radius: 5px;
    }

    th,
    td {
        font-size: 12px;
        padding: 6px 2px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🧠 Memory Master</h1>

    <div class="subtitle">
        Test your memory and beat your high score
    </div>

    <!-- PLAYER -->

    <div class="player">

        <input
            id="playerName"
            type="text"
            placeholder="Enter player name"
            maxlength="20"
        >

        <button
            class="new-game"
            onclick="startGame()"
        >
            🎮 New Game
        </button>

    </div>


    <!-- LEVELS -->

    <div class="levels">

        <button
            class="level active"
            data-size="4"
            onclick="selectLevel(4)"
        >
            🟢 4 × 4
        </button>

        <button
            class="level"
            data-size="6"
            onclick="selectLevel(6)"
        >
            🟡 6 × 6
        </button>

        <button
            class="level"
            data-size="8"
            onclick="selectLevel(8)"
        >
            🔴 8 × 8
        </button>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <small>Moves</small>
            <strong id="moves">0</strong>
        </div>

        <div class="stat">
            <small>Matches</small>
            <strong id="matches">0</strong>
        </div>

        <div class="stat">
            <small>Time</small>
            <strong id="time">00:00</strong>
        </div>

        <div class="stat">
            <small>Accuracy</small>
            <strong id="accuracy">100%</strong>
        </div>

    </div>


    <!-- GAME BOARD -->

    <div
        id="board"
        class="board"
    ></div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="restart"
            onclick="startGame()"
        >
            🔄 Restart
        </button>

        <button
            id="soundButton"
            class="sound"
            onclick="toggleSound()"
        >
            🔊 Sound ON
        </button>

    </div>


    <!-- LEADERBOARD -->

    <div class="leaderboard">

        <h2>🏆 High Scores</h2>

        <table>

            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>Level</th>
                    <th>Moves</th>
                    <th>Time</th>
                    <th>Score</th>
                </tr>
            </thead>

            <tbody id="scores"></tbody>

        </table>

    </div>

</div>


<!-- WIN MODAL -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <div class="trophy">
            🏆
        </div>

        <h2>Congratulations!</h2>

        <div id="result"></div>

        <button onclick="closeModal(); startGame();">
            🎮 Play Again
        </button>

    </div>

</div>


<script>

/* ==========================================
   GAME SETTINGS
========================================== */

const emojis = [
    "🍎","🍌","🍇","🍉",
    "🍊","🍋","🍓","🍒",
    "🥝","🍍","🥭","🍑",
    "🍐","🥥","🍅","🥕",
    "🌽","🥔","🍔","🍕",
    "🍩","🍪","🍰","🎂",
    "⚽","🏀","🏈","⚾",
    "🚗","✈️","🚀","🎸"
];

let level = 4;

let firstCard = null;
let secondCard = null;

let locked = false;

let moves = 0;
let matches = 0;

let seconds = 0;

let timer = null;

let soundOn = true;

let audio = null;


/* ==========================================
   SELECT LEVEL
========================================== */

function selectLevel(size) {

    level = size;

    document.querySelectorAll(".level")
        .forEach(button => {

            button.classList.remove("active");

            if (
                Number(button.dataset.size)
                === size
            ) {
                button.classList.add("active");
            }

        });

    startGame();
}


/* ==========================================
   START GAME
========================================== */

function startGame() {

    clearInterval(timer);

    firstCard = null;
    secondCard = null;

    locked = false;

    moves = 0;
    matches = 0;
    seconds = 0;

    updateStats();

    document.getElementById("message")
        .textContent = "";

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    board.style.gridTemplateColumns =
        `repeat(${level}, 1fr)`;


    /*
       Example:

       4 × 4 = 16 cards = 8 pairs
       6 × 6 = 36 cards = 18 pairs
       8 × 8 = 64 cards = 32 pairs
    */

    const numberOfPairs =
        (level * level) / 2;


    let selected =
        emojis.slice(0, numberOfPairs);


    let gameCards =
        [...selected, ...selected];


    shuffle(gameCards);


    gameCards.forEach(
        (emoji, index) => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.dataset.value = emoji;

            card.innerHTML = `
                <div class="card-inner">

                    <div class="card-front">
                        ?
                    </div>

                    <div class="card-back">
                        ${emoji}
                    </div>

                </div>
            `;

            card.onclick =
                function() {
                    flipCard(card);
                };

            board.appendChild(card);

        }
    );
}


/* ==========================================
   SHUFFLE
========================================== */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [array[i], array[j]] =
        [array[j], array[i]];

    }
}


/* ==========================================
   FLIP CARD
========================================== */

function flipCard(card) {

    if (locked)
        return;

    if (card === firstCard)
        return;

    if (card.classList.contains("matched"))
        return;

    /*
       Start timer on first card
    */

    if (
        moves === 0 &&
        firstCard === null
    ) {
        startTimer();
    }

    card.classList.add("flipped");

    playSound("flip");


    if (firstCard === null) {

        firstCard = card;

        return;
    }


    secondCard = card;

    moves++;

    updateStats();

    checkCards();
}


/* ==========================================
   CHECK CARDS
========================================== */

function checkCards() {

    const match =
        firstCard.dataset.value
        ===
        secondCard.dataset.value;


    if (match) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        matches++;

        playSound("match");

        resetSelection();

        updateStats();


        const totalPairs =
            (level * level) / 2;


        if (matches === totalPairs) {

            finishGame();
        }

    } else {

        locked = true;

        playSound("wrong");


        setTimeout(function() {

            firstCard.classList.remove("flipped");
            secondCard.classList.remove("flipped");

            resetSelection();

        }, 800);
    }
}


/* ==========================================
   RESET CARD SELECTION
========================================== */

function resetSelection() {

    firstCard = null;
    secondCard = null;

    locked = false;
}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

    clearInterval(timer);

    timer = setInterval(function() {

        seconds++;

        updateStats();

    }, 1000);
}


/* ==========================================
   UPDATE STATS
========================================== */

function updateStats() {

    document.getElementById("moves")
        .textContent = moves;

    document.getElementById("matches")
        .textContent =
        `${matches}/${(level * level) / 2}`;

    document.getElementById("time")
        .textContent =
        formatTime(seconds);


    let accuracy = 100;

    if (moves > 0) {

        accuracy =
            Math.round(
                (matches / moves) * 100
            );
    }

    document.getElementById("accuracy")
        .textContent =
        accuracy + "%";
}


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(value) {

    const minutes =
        Math.floor(value / 60)
        .toString()
        .padStart(2, "0");

    const secs =
        (value % 60)
        .toString()
        .padStart(2, "0");

    return `${minutes}:${secs}`;
}


/* ==========================================
   FINISH GAME
========================================== */

function finishGame() {

    clearInterval(timer);

    const nameInput =
        document.getElementById("playerName");

    let player =
        nameInput.value.trim();

    if (!player) {
        player = "Player";
    }


    const accuracy =
        moves === 0
        ? 100
        : Math.round(
            (matches / moves) * 100
        );


    /*
       Score
    */

    let base;

    if (level === 4) {
        base = 1000;
    } else if (level === 6) {
        base = 2500;
    } else {
        base = 6000;
    }


    let score =
        base
        + accuracy * 10
        - seconds * 5
        - moves * 10;


    score =
        Math.max(
            100,
            Math.round(score)
        );


    /*
       Save
    */

    saveScore(
        player,
        level,
        moves,
        seconds,
        score
    );


    /*
       Show result
    */

    document.getElementById("result")
        .innerHTML = `

            <p>Player:
                <strong>${escapeHTML(player)}</strong>
            </p>

            <p>Level:
                <strong>${level} × ${level}</strong>
            </p>

            <p>Moves:
                <strong>${moves}</strong>
            </p>

            <p>Time:
                <strong>${formatTime(seconds)}</strong>
            </p>

            <p>Accuracy:
                <strong>${accuracy}%</strong>
            </p>

            <h3>Score: ${score}</h3>

        `;


    document.getElementById("modal")
        .classList.add("show");


    document.getElementById("message")
        .textContent =
        "🎉 Game completed!";


    playSound("win");

    showScores();
}


/* ==========================================
   LOCAL STORAGE
========================================== */

function saveScore(
    player,
    gameLevel,
    gameMoves,
    gameTime,
    gameScore
) {

    let scores =
        JSON.parse(
            localStorage.getItem(
                "memoryGameScores"
            )
        ) || [];


    scores.push({

        player: player,

        level:
            `${gameLevel}×${gameLevel}`,

        moves: gameMoves,

        time: gameTime,

        score: gameScore

    });


    scores.sort(
        (a, b) =>
            b.score - a.score
    );


    /*
       Keep top 20
    */

    scores =
        scores.slice(0, 20);


    localStorage.setItem(
        "memoryGameScores",
        JSON.stringify(scores)
    );
}


/* ==========================================
   SHOW SCORES
========================================== */

function showScores() {

    const table =
        document.getElementById("scores");

    const scores =
        JSON.parse(
            localStorage.getItem(
                "memoryGameScores"
            )
        ) || [];


    if (scores.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="6">
                    No scores yet
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = "";


    scores.forEach(
        (score, index) => {

            const row =
                document.createElement("tr");

            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHTML(score.player)}
                </td>

                <td>
                    ${score.level}
                </td>

                <td>
                    ${score.moves}
                </td>

                <td>
                    ${formatTime(score.time)}
                </td>

                <td>
                    <strong>
                        ${score.score}
                    </strong>
                </td>

            `;

            table.appendChild(row);

        }
    );
}


/* ==========================================
   SOUND
========================================== */

function playSound(type) {

    if (!soundOn)
        return;


    if (!audio) {

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();


    oscillator.connect(gain);
    gain.connect(audio.destination);


    let frequency = 400;
    let duration = 0.1;


    if (type === "flip") {

        frequency = 500;
        duration = 0.06;

    }

    if (type === "match") {

        frequency = 800;
        duration = 0.15;

    }

    if (type === "wrong") {

        frequency = 180;
        duration = 0.15;

    }

    if (type === "win") {

        frequency = 1000;
        duration = 0.5;

    }


    oscillator.frequency.value =
        frequency;

    oscillator.type = "sine";


    gain.gain.setValueAtTime(
        0.15,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + duration
    );


    oscillator.start();

    oscillator.stop(
        audio.currentTime + duration
    );
}


/* ==========================================
   SOUND BUTTON
========================================== */

function toggleSound() {

    soundOn = !soundOn;

    document.getElementById(
        "soundButton"
    ).textContent =
        soundOn
        ? "🔊 Sound ON"
        : "🔇 Sound OFF";
}


/* ==========================================
   MODAL
========================================== */

function closeModal() {

    document.getElementById("modal")
        .classList.remove("show");
}


/* ==========================================
   SECURITY
========================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


/* ==========================================
   INITIALIZE
========================================== */

showScores();

startGame();

</script>

</body>
</html>
